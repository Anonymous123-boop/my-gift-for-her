<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Create a bouquet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@500;600&family=Caveat:wght@500;600&family=Noto+Sans+KR:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Night sky -->
  <div class="sky" aria-hidden="true">
    <canvas id="stars"></canvas>          <!-- twinkling + shooting stars -->
    <div class="moon-wrap">               <!-- floats gently -->
      <div class="moon-halo"></div>
      <div class="moon"></div>
    </div>
  </div>

  <!-- Entrance particles -->
  <canvas id="intro" aria-hidden="true"></canvas>

  <!-- Top left: song picker (circle that expands) -->
  <div class="song-orb" id="songOrb">
    <button class="song-orb__toggle" id="songToggle" aria-label="Choose a song" aria-expanded="false">
      <!-- Shows the vinyl image once assets/icons/vinyl.png exists; until then a plain dot -->
      <img class="song-orb__vinyl" alt="" draggable="false" width="44" height="44" style="max-width:44px;max-height:44px" />
      <span class="song-orb__dot"></span>
    </button>
    <ul class="song-orb__list" id="songList"></ul>
  </div>

  <!-- Top right: volume slider + music on/off -->
  <div class="music-ctrl" id="musicCtrl">
    <input class="volume" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume" />
    <!-- PLACEHOLDER: plain text glyph, swap for an assets/icons image later -->
    <button class="music-toggle" id="musicToggle" type="button" aria-label="Turn music off" aria-pressed="true">
      <span class="music-toggle__glyph">&#9834;</span>
    </button>
  </div>

  <!-- Small notice (e.g. a song file could not be found) -->
  <p class="notice" id="notice" role="status"></p>

  <!-- Random message (appears above the box after each flower) -->
  <p class="message" id="message" aria-live="polite"></p>

  <!-- Wrapper (PLACEHOLDER shape drawn in CSS; swap for assets/wrapper image later) -->
  <div class="wrapper" id="wrapper" aria-hidden="true">
    <div class="wrapper__paper"></div>
  </div>

  <!-- Flowers float inside this layer -->
  <div class="flower-layer" id="flowerLayer"></div>

  <!-- After the bouquet forms: secret message + envelope -->
  <div class="reveal" id="reveal">
    <p class="secret" id="secret"></p>
    <!-- PLACEHOLDER: envelope drawn in CSS; swap for an assets/ image later -->
    <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
      <span class="envelope__body"></span>
      <span class="envelope__flap"></span>
    </button>
  </div>

  <!-- The letter -->
  <div class="letter" id="letter" role="dialog" aria-modal="true" aria-label="Letter">
    <div class="letter__paper" id="letterPaper">
      <div class="letter__scroll" id="letterScroll">
        <div class="letter__text" id="letterText"></div>
        <button class="letter__done" id="letterDone" type="button">All done</button>
      </div>
      <div class="letter__roll" id="letterRoll"></div>   <!-- paper-roll shading used when the letter rolls up -->
    </div>
  </div>

  <!-- Main floating box -->
  <div class="stage" id="stage">
    <button class="box" id="boxBtn" type="button">
      <span class="box__label" id="boxLabel">Create a bouquet</span>
    </button>
  </div>

  <!-- Finale: white screen, falling paper bits, floating image card, card wall -->
  <div class="whiteout" id="whiteout"></div>
  <div class="wall" id="wall" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="card-layer" id="cardLayer"></div>

  <!-- After the wall: messages, cards gather into a gift, the file -->
  <div class="dim" id="dim"></div>
  <p class="finale-msg" id="finaleMsg" aria-live="polite"></p>
  <div class="gather-layer" id="gatherLayer"></div>

  <!-- Gift (PLACEHOLDER drawn in CSS; swap for an assets/ image later) -->
  <div class="gift-layer" id="giftLayer">
    <div class="gift-wrap" id="giftWrap">
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">
        <div class="gift__box"></div>
        <div class="gift__lid" id="giftLid">
          <div class="gift__bow"><span class="gift__knot"></span></div>
        </div>
      </div>
      <p class="gift__note" id="giftNote"></p>
    </div>
  </div>

  <!-- The file that pops out of the gift -->
  <div class="doc" id="doc">
    <div class="doc__sheet">
      <div class="doc__band"><span class="doc__tag">A little gift for you</span></div>
      <h2 class="doc__title" id="docTitle"></h2>
      <p class="doc__text" id="docText"></p>
      <div class="doc__file">
        <span class="doc__icon" aria-hidden="true">FILE</span>
        <span class="doc__fileinfo"><b id="docName"></b><small>Ready to download</small></span>
      </div>
      <button class="doc__btn" id="docBtn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        <span id="docBtnText"></span>
      </button>
      <p class="doc__status" id="docStatus" role="status"></p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
